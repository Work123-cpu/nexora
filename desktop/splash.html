<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Nexora</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
  }

  /* The window itself is transparent so these rounded corners actually show the
     desktop through them — everything visible lives inside this panel. */
  .panel {
    position: fixed; inset: 0;
    border-radius: 26px;
    overflow: hidden;
    background: #05060f;
    box-shadow:
      0 0 0 1px rgba(129, 140, 248, 0.28),
      0 24px 70px rgba(0, 0, 0, 0.65),
      inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }

  #stars {
    position: absolute; inset: 0; z-index: 0;
  }

  .nebula {
    position: absolute; inset: -20%; z-index: 1;
    background:
      radial-gradient(ellipse 60% 45% at 30% 25%, rgba(79,70,229,0.20), transparent 60%),
      radial-gradient(ellipse 55% 40% at 75% 70%, rgba(8,145,178,0.16), transparent 60%);
    animation: drift 14s ease-in-out infinite alternate;
    pointer-events: none;
  }
  @keyframes drift {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(-2%, 2%) scale(1.05); }
  }

  .stage {
    position: relative; z-index: 2;
    width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    -webkit-app-region: drag;
  }

  .rig {
    position: relative;
    width: 260px; height: 260px;
    display: flex; align-items: center; justify-content: center;
  }

  /* ---- shards: fly in from off-stage, converge, then vanish ---- */
  .shard {
    position: absolute;
    width: 78px; height: 78px;
    background: linear-gradient(135deg, #7c6cf5 0%, #4f46e5 45%, #0891b2 100%);
    clip-path: polygon(50% 0%, 100% 35%, 78% 100%, 12% 90%);
    filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.85));
    opacity: 0;
    animation: shardFly 900ms cubic-bezier(.16,.9,.2,1.15) forwards;
    animation-delay: var(--d);
  }
  .shard.s1 { --fx: -320px; --fy: -260px; --fr: -140deg; }
  .shard.s2 { --fx: 330px;  --fy: -235px; --fr: 160deg;  }
  .shard.s3 { --fx: -345px; --fy: 40px;   --fr: 90deg;   }
  .shard.s4 { --fx: 355px;  --fy: 25px;   --fr: -110deg; }
  .shard.s5 { --fx: -260px; --fy: 285px;  --fr: 60deg;   }
  .shard.s6 { --fx: 270px;  --fy: 295px;  --fr: -70deg;  }
  .shard.s7 { --fx: 0px;    --fy: -345px; --fr: 200deg;  }
  .shard.s8 { --fx: 0px;    --fy: 345px;  --fr: -200deg; }

  @keyframes shardFly {
    0%   { transform: translate(var(--fx), var(--fy)) rotate(var(--fr)) scale(0.4); opacity: 0; }
    55%  { opacity: 1; }
    78%  { transform: translate(0, 0) rotate(0deg) scale(1.08); opacity: 1; }
    88%  { transform: translate(0, 0) rotate(0deg) scale(0.98); opacity: 1; }
    92%  { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
    100% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 0; }
  }

  /* impact flash at the moment of assembly */
  .flash {
    position: absolute; width: 40px; height: 40px; border-radius: 50%;
    background: radial-gradient(circle, rgba(190,220,255,0.95) 0%, rgba(99,102,241,0.55) 40%, transparent 72%);
    opacity: 0;
    animation: flashBurst 700ms ease-out forwards;
    animation-delay: 760ms;
  }
  @keyframes flashBurst {
    0%   { transform: scale(0.2); opacity: 0; }
    18%  { transform: scale(1.9); opacity: 1; }
    100% { transform: scale(5.5); opacity: 0; }
  }

  /* the real logo, crossfades in as the shards vanish */
  .logo-wrap {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    animation: logoIn 650ms ease-out forwards, breathe 3.6s ease-in-out 2.4s infinite;
    animation-delay: 820ms, 2400ms;
    transform-origin: center;
  }
  @keyframes logoIn {
    0%   { opacity: 0; transform: scale(0.9); filter: brightness(2.2) saturate(1.4); }
    100% { opacity: 1; transform: scale(1);   filter: brightness(1) saturate(1); }
  }
  @keyframes breathe {
    0%, 100% { filter: drop-shadow(0 0 16px rgba(99,102,241,0.55)); }
    50%      { filter: drop-shadow(0 0 26px rgba(34,211,238,0.65)); }
  }

  .logo-img {
    width: 260px; height: auto;
    filter: drop-shadow(0 0 16px rgba(99,102,241,0.55));
  }

  /* status line beneath, fades in after the reveal settles */
  .status {
    margin-top: 16px;
    display: flex; align-items: center; gap: 10px;
    opacity: 0;
    animation: fadeUp 600ms ease-out forwards;
    animation-delay: 1900ms;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .status-text {
    font-size: 11.5px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: rgba(199, 210, 254, 0.75);
  }
  .dots span {
    display: inline-block; width: 4px; height: 4px; border-radius: 50%;
    background: #818cf8; margin-left: 3px;
    animation: pulse 1.1s ease-in-out infinite;
  }
  .dots span:nth-child(2) { animation-delay: 0.15s; }
  .dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); }
    40% { opacity: 1; transform: scale(1.15); }
  }

  .hairline {
    position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
    width: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(129,140,248,0.7), transparent);
    animation: growLine 900ms ease-out forwards;
    animation-delay: 2000ms;
  }
  @keyframes growLine {
    from { width: 0; }
    to   { width: 150px; }
  }
</style>
</head>
<body>
  <div class="panel">
    <canvas id="stars"></canvas>
    <div class="nebula"></div>

    <div class="stage">
      <div class="rig">
        <div class="shard s1" style="--d:0ms"></div>
        <div class="shard s2" style="--d:40ms"></div>
        <div class="shard s3" style="--d:80ms"></div>
        <div class="shard s4" style="--d:120ms"></div>
        <div class="shard s5" style="--d:60ms"></div>
        <div class="shard s6" style="--d:100ms"></div>
        <div class="shard s7" style="--d:20ms"></div>
        <div class="shard s8" style="--d:140ms"></div>
        <div class="flash"></div>
        <div class="logo-wrap">
          <img class="logo-img" src="./build/logo-transparent.png" alt="Nexora" />
        </div>
      </div>
      <div class="status">
        <span class="status-text" id="statusText">Initializing</span>
        <span class="dots"><span></span><span></span><span></span></span>
      </div>
    </div>
    <div class="hairline"></div>
  </div>

<script>
  // Lightweight starfield — small twinkling dots plus a couple of brighter drifting ones.
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  function resize() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const STAR_COUNT = 90;
  const stars = Array.from({ length: STAR_COUNT }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 1.2 + 0.3,
    phase: Math.random() * Math.PI * 2,
    speed: Math.random() * 0.02 + 0.006,
    drift: Math.random() * 0.04 - 0.02,
  }));

  function frame(t) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const s of stars) {
      const twinkle = 0.45 + 0.55 * Math.sin(t * s.speed + s.phase);
      ctx.globalAlpha = Math.max(0, twinkle);
      ctx.fillStyle = '#cfd8ff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
      s.y += s.drift * 0.15;
      if (s.y < 0) s.y = canvas.height;
      if (s.y > canvas.height) s.y = 0;
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Live status text, pushed from main.js as each local service comes up.
  if (window.nexoraSplash && window.nexoraSplash.onStatus) {
    window.nexoraSplash.onStatus((text) => {
      const el = document.getElementById('statusText');
      if (el) el.textContent = text;
    });
  }
</script>
</body>
</html>
